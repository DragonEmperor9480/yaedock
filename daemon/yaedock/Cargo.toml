[package]
name = "yaedock"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.30.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = "0.30.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
yaedock-core = { path = "../yaedock-core" }
yaedock-proto = { path = "../yaedock-proto" }
yaedock-sys = { path = "../yaedock-sys" }
yaedockd = { path = "../yaedockd" }
