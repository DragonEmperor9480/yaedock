<svg xmlns="http://www.w3.org/2000/svg" xmlns:yd="https://yaedock.amrutlabs.in/clock" yd:id="flip" yd:name="Flip" yd:description="Two flip-clock cards" viewBox="0 0 424 190">
  <rect x="0" y="0" width="200" height="190" rx="22" fill="{raised}"/>
  <text x="100" y="140" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="132" letter-spacing="-6" fill="{text}">{hh}</text>
  <rect x="0" y="93" width="200" height="4" fill="{card}"/>
  <circle cx="0" cy="95" r="6" fill="{card}"/>
  <circle cx="200" cy="95" r="6" fill="{card}"/>
  <rect x="224" y="0" width="200" height="190" rx="22" fill="{raised}"/>
  <text x="324" y="140" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="132" letter-spacing="-6" fill="{text}">{mm}</text>
  <rect x="224" y="93" width="200" height="4" fill="{card}"/>
  <circle cx="224" cy="95" r="6" fill="{card}"/>
  <circle cx="424" cy="95" r="6" fill="{card}"/>
  <text x="412" y="178" text-anchor="end" font-family="Space Grotesk" font-weight="600" font-size="16" fill="{accent}">{ampm}</text>
</svg>
