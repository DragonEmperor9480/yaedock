<svg xmlns="http://www.w3.org/2000/svg" xmlns:yd="https://yaedock.amrutlabs.in/clock" yd:id="stacked" yd:name="Stacked" yd:description="Hours over minutes, big and bold" viewBox="0 0 250 250">
  <text x="0" y="112" font-family="Space Grotesk" font-weight="700" font-size="138" letter-spacing="-1" fill="{text}">{hh}</text>
  <text x="0" y="236" font-family="Space Grotesk" font-weight="700" font-size="138" letter-spacing="-1" fill="{accent}">{mm}</text>
</svg>
