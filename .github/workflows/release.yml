name: Release

# Run by hand from the Actions tab. The version comes from yae_version.json;
# bump it before releasing, because an existing tag stops the run.
# Write release-notes/VERSION.md for the release's page; without it the page
# only lists the pull requests.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read yae_version.json
        id: read
        run: |
          version=$(jq -er '.version' yae_version.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=yae_version.json::\"$version\" is not a version like 1.2.3"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error file=yae_version.json::v$version is already released, bump the version first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  daemon:
    name: Build the PC program
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-gnu

      # zig links both programs for an older glibc, so they run on older
      # distributions too, and builds the ARM one with no ARM system.
      - uses: mlugg/setup-zig@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - name: Use the release version
        working-directory: daemon
        run: sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml

      - name: Test
        working-directory: daemon
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build
        working-directory: daemon
        run: |
          cargo zigbuild --release -p yaedock --target x86_64-unknown-linux-gnu.2.28
          mkdir -p ../dist
          cp target/x86_64-unknown-linux-gnu/release/yaedock ../dist/yaedock

      # Runs on glibc 2.28 and newer, as the x86_64 one: Debian 10,
      # Ubuntu 20.04, Raspberry Pi OS.
      - name: Build for ARM
        working-directory: daemon
        run: |
          cargo zigbuild --release -p yaedock --target aarch64-unknown-linux-gnu.2.28
          cp target/aarch64-unknown-linux-gnu/release/yaedock ../dist/yaedock-aarch64
          file ../dist/yaedock-aarch64 | grep -q 'ARM aarch64'

      - uses: actions/upload-artifact@v4
        with:
          name: daemon
          path: |
            dist/yaedock
            dist/yaedock-aarch64
          if-no-files-found: error

  android:
    name: Build the Android app
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KEYSTORE_BASE64: ${{ secrets.YAEDOCK_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Only platform-tools: the action's default also asks for the old "tools"
      # package, which newer command-line tools no longer have. Gradle fetches
      # the SDK platform and build tools the app needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v5

      - name: Test
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Build the signed release APK
        working-directory: android
        env:
          YAEDOCK_KEYSTORE_PASSWORD: ${{ secrets.YAEDOCK_KEYSTORE_PASSWORD }}
          YAEDOCK_KEY_ALIAS: ${{ secrets.YAEDOCK_KEY_ALIAS }}
          YAEDOCK_KEY_PASSWORD: ${{ secrets.YAEDOCK_KEY_PASSWORD }}
        run: |
          for secret in KEYSTORE_BASE64 YAEDOCK_KEYSTORE_PASSWORD YAEDOCK_KEY_ALIAS YAEDOCK_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::The signing secrets are not set (missing ${secret/#KEYSTORE/YAEDOCK_KEYSTORE})"
              exit 1
            fi
          done
          export YAEDOCK_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$YAEDOCK_KEYSTORE"
          ./gradlew assembleRelease
          mkdir -p ../dist
          # Each APK twice: by a fixed name, which the website links to
          # (releases/latest/download/yaedock-app-arm64.apk), and by the name
          # with the version, which apps up to 0.4.0 update themselves from.
          # Drop the versioned copies at 1.0.0 (see "Cleanups for 1.0.0" in docs/PLAN.md).
          for pair in arm64-v8a:arm64 armeabi-v7a:arm32 x86_64:x86_64; do
            abi=${pair%%:*}
            apk="app/build/outputs/apk/release/app-$abi-release.apk"
            cp "$apk" "../dist/yaedock-app-${pair##*:}.apk"
            cp "$apk" "../dist/yaedock-$VERSION-$abi.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [version, daemon, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Only for release-notes/, the notes written for this version, and the
      # install script, which goes in the release beside the programs.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /release-notes/
            /install.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cp install.sh dist/install.sh
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create the release
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          # Notes written for this version go first, above GitHub's list of
          # the pull requests merged since the last release.
          notes=()
          if [[ -f "release-notes/$VERSION.md" ]]; then
            notes=(--notes-file "release-notes/$VERSION.md")
          else
            echo "::warning::No release-notes/$VERSION.md, so the release only lists pull requests"
          fi
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "YaeDock $VERSION" \
            --generate-notes \
            "${notes[@]}" \
            "${prerelease[@]}"
